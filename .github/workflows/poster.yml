name: poster

on:
  schedule:
    # GitHub starts scheduled runs late, so run 10 minutes ahead of the :30 / :00 slots;
    # poster.py waits for the exact time.
    - cron: "20,50 * * * *"
  # a queue change runs it straight away, so "post now" does not wait for the next slot
  push:
    branches: [main]
    paths: [queue.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: poster
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Post what is due
        env:
          GH_TOKEN: ${{ github.token }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python3 poster.py run
      - name: Save the queue
        if: always()
        run: |
          git config user.name "poster"
          git config user.email "poster@users.noreply.github.com"
          git add queue.json
          git diff --cached --quiet || (git commit -m "Update queue" && git pull --rebase && git push)
