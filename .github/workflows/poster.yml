name: poster

on:
  schedule:
    # only a backup: GitHub starts scheduled runs hours late or skips them, so the
    # "wait" job below keeps one run up that watches the queue itself
    - cron: "20,50 * * * *"
  # a queue change (or a change to the worker itself) starts it straight away
  push:
    branches: [main]
    paths: [queue.json, poster.py, tiktok.py, .github/workflows/poster.yml]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  wait:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    outputs:
      next: ${{ steps.wait.outputs.next }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Wait for the next post
        id: wait
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 poster.py wait

  post:
    needs: wait
    if: needs.wait.outputs.next == 'due'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: poster
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Post what is due
        env:
          GH_TOKEN: ${{ github.token }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python3 poster.py run
      - name: Post to TikTok
        # uploads what poster.py just posted; its link then goes to Whop with the others
        if: always()
        env:
          TIKTOK_STATE: ${{ secrets.TIKTOK_STATE }}
        run: if command -v xvfb-run >/dev/null; then xvfb-run -a python3 tiktok.py run; else python3 tiktok.py run; fi
      - name: Keep failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: "*.png"
          if-no-files-found: ignore
      - name: Submit to Whop
        # Whop takes a link only within 30 minutes of posting, so this follows straight on
        if: always()
        env:
          WHOP_STATE: ${{ secrets.WHOP_STATE }}
        run: if command -v xvfb-run >/dev/null; then xvfb-run -a python3 whop.py run; else python3 whop.py run; fi
      - name: Save the queue
        if: always()
        run: |
          git config user.name "poster"
          git config user.email "poster@users.noreply.github.com"
          git add queue.json
          git diff --cached --quiet || (git commit -m "Update queue" && git pull --rebase && git push)

  # keeps the chain going: a fresh run takes over the watching
  again:
    needs: [wait, post]
    if: always() && (needs.wait.outputs.next == 'due' || needs.wait.outputs.next == 'again')
    runs-on: ubuntu-latest
    steps:
      - name: Start the next run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run poster.yml --repo "$GITHUB_REPOSITORY" --ref main
